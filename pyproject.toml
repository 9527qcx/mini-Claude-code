[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-claude-code"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.109.1",
    "python-dotenv>=1.1.0",
    "httpx>=0.23.0,<1",
]

[tool.setuptools.packages.find]
include = ["mini_claude*"]